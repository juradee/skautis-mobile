name: skautis-mobile

services:
  php:
    build:
      context: docker/php
    volumes:
      - .:/app
    environment:
      # Xdebug stays off unless you run `make up XDEBUG_MODE=debug`.
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      database:
        condition: service_healthy

  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=skautis-mobile_traefik
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --log.level=INFO
    ports:
      # Port 80 může držet jen jeden projekt; jinak HTTP_PORT=8080 make up.
      - "${HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    volumes:
      # Rootless Docker: socket je v runtime adresáři uživatele, ne ve /var/run.
      - ${DOCKER_SOCK:-/run/user/1000/docker.sock}:/var/run/docker.sock:ro
    networks:
      - traefik

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - .:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - traefik
    labels:
      traefik.enable: 'true'
      traefik.docker.network: skautis-mobile_traefik
      traefik.http.routers.skautis.rule: Host(`${APP_HOST:-skautis.localhost}`)
      traefik.http.routers.skautis.entrypoints: web
      traefik.http.services.skautis.loadbalancer.server.port: '80'
    depends_on:
      - php

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

networks:
  traefik:
    name: skautis-mobile_traefik

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
